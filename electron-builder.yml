appId: com.wangp.desktop
productName: Wan2GP Desktop Launcher
directories:
  buildResources: resources
files:
  - 'package.json'
  - 'main.js'
  - 'preload.js'
  - 'renderer/**/*'
  - 'lib/**/*'
  - 'services/**/*'
  - 'resources/**/*'
  - 'scripts/**/*'
  - 'docs/**/*'
  - 'changelogs/**/*'
  - 'infographic.html'
  - 'README.md'
  - 'LICENSE'
  - 'PREREQUISITES.md'
  - 'screenshots/**/*'
  # Exclude dev/test artifacts, stray logs and temp files so they never land in
  # the packed app (a stray file in the source root previously corrupted the
  # embedded package.json and broke launch with "unable to parse").
  - '!**/*.test.js'
  - '!tests/**'
  - '!**/*.log'
  - '!build_*.log'
  - '!nul'
  - '!ISSUE74_REPLY.md'
win:
  target: nsis
  icon: resources/icon-1024.png
  # Sign every Windows executable with SignPath.io during the build (before
  # latest.yml sha512/blockmap are computed, so auto-update hashes stay valid).
  # The hook is a no-op unless SIGNPATH_API_TOKEN is set — unsigned otherwise.
  # See docs/SIGNPATH_SIGNING.md for setup.
  signtoolOptions:
    sign: ./scripts/signpath-sign.js
    # SignPath returns one fully signed artifact per request; a single SHA-256
    # signature is what modern Windows (10/11) wants. Avoids the default
    # sha1+sha256 double-call (which would sign the same file twice).
    signingHashAlgorithms:
      - sha256
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target: dmg
  icon: resources/icon-1024.png
  category: public.app-category.creative-tools
publish:
  provider: github
  owner: GKartist75
  repo: wan2gp-desktop
artifactName: Wan2GP-Desktop-Launcher-${version}-${os}-${arch}.${ext}
