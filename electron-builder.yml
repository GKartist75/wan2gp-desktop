appId: com.wangp.desktop
productName: Wan2GP Desktop Launcher
directories:
  buildResources: resources
files:
  - '**/*'
  - '!**/.git/**'
  - '!tests/**'
  - '!.github/**'
  - '!dist/**'
win:
  target: nsis
  icon: resources/icon-1024.png
  # Sign every Windows executable with SignPath.io during the build (before
  # latest.yml sha512/blockmap are computed, so auto-update hashes stay valid).
  # The hook is a no-op unless SIGNPATH_API_TOKEN is set — unsigned otherwise.
  # See docs/SIGNPATH_SIGNING.md for setup.
  signtoolOptions:
    sign: ./scripts/signpath-sign.js
    # SignPath returns one fully signed artifact per request; a single SHA-256
    # signature is what modern Windows (10/11) wants. Avoids the default
    # sha1+sha256 double-call (which would sign the same file twice).
    signingHashAlgorithms:
      - sha256
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target: dmg
  icon: resources/icon-1024.png
  category: public.app-category.creative-tools
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon-1024.png
  category: Development
  synopsis: Wan2GP Desktop Launcher
  syncDesktopName: true
# Explicit full Electron dependency set. electron-builder's defaults omit
# libasound2/libgbm1, which makes the deb fail to load on fresh minimal
# Ubuntu installs ("libasound.so.2: cannot open shared object file").
# libasound2 is a transitional package on 24.04+/26.04 (pulls t64), so it
# still resolves on both old and new Ubuntu lines.
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2
    - libgbm1
publish:
  provider: github
  owner: GKartist75
  repo: wan2gp-desktop
artifactName: Wan2GP-Desktop-Launcher-${version}-${os}-${arch}.${ext}
