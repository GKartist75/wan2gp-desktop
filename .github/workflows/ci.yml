name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax-check main-process sources
        run: |
          node --check main.js
          node --check preload.js
          node --check services/auto-tune.js
          node --check services/settings-repair.js
          node --check services/catalog.js
          node --check services/gallery.js
          node --check services/memory-profile.js
          node --check services/queue-notifier.js
          node --check services/install-plan.js
          node --check scripts/signpath-sign.js
          node --check renderer/app.js

      - name: Run unit tests
        run: npm test

  build-windows:
    # Build the installer on version tags so the release is reproducible and
    # never depends on a maintainer's machine.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        env:
          # SignPath.io code signing (free OSS tier). Empty until the secrets
          # are added — the sign hook then logs and skips, keeping the build
          # unsigned-but-green. See docs/SIGNPATH_SIGNING.md.
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: npx electron-builder --win --publish never --config electron-builder.yml

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
